<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A modern responsive calculator with keyboard support and calculation history">

    <title>Modern Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <!-- Header -->
        <header class="calculator-header">
            <h1>Calculator</h1>
            <span>v2</span>
        </header>


        <!-- Display -->
        <section class="display-container">

            <input
                type="text"
                id="display"
                value="0"
                readonly
                aria-label="Calculator display">

        </section>


        <!-- Calculator Buttons -->
        <section class="buttons">

            <!-- First Row -->
            <button
                class="function"
                onclick="clearDisplay()">
                AC
            </button>

            <button
                class="function"
                onclick="deleteLast()">
                DEL
            </button>

            <button
                class="function"
                onclick="addToDisplay('%')">
                %
            </button>

            <button
                class="operator"
                onclick="addToDisplay('/')">
                ÷
            </button>


            <!-- Second Row -->
            <button onclick="addToDisplay('7')">7</button>

            <button onclick="addToDisplay('8')">8</button>

            <button onclick="addToDisplay('9')">9</button>

            <button
                class="operator"
                onclick="addToDisplay('*')">
                ×
            </button>


            <!-- Third Row -->
            <button onclick="addToDisplay('4')">4</button>

            <button onclick="addToDisplay('5')">5</button>

            <button onclick="addToDisplay('6')">6</button>

            <button
                class="operator"
                onclick="addToDisplay('-')">
                −
            </button>


            <!-- Fourth Row -->
            <button onclick="addToDisplay('1')">1</button>

            <button onclick="addToDisplay('2')">2</button>

            <button onclick="addToDisplay('3')">3</button>

            <button
                class="operator"
                onclick="addToDisplay('+')">
                +
            </button>


            <!-- Fifth Row -->
            <button
                class="zero"
                onclick="addToDisplay('0')">
                0
            </button>

            <button onclick="addToDisplay('.')">
                .
            </button>

            <button
                class="equal"
                onclick="calculate()">
                =
            </button>

        </section>


        <!-- History -->
        <section class="history">

            <div class="history-header">

                <h2>History</h2>

                <button
                    class="clear-history"
                    onclick="clearHistory()">
                    Clear
                </button>

            </div>


            <div
                id="historyList"
                class="history-list">

                <p class="empty-history">
                    No calculations yet
                </p>

            </div>

        </section>


        <!-- Keyboard Hint -->
        <footer class="keyboard-hint">
            Keyboard supported • Enter = Calculate •
            Backspace = Delete • Esc = Clear
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
